[project]
name = "player-archetypes"
version = "0.1.0"
description = "Point-in-time role archetypes for basketball player-games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3,<3",
    "polars>=1.44.2,<2",
    "pyarrow>=25.0.1,<26",
    "scikit-learn>=1.9.1,<2",
]

[project.optional-dependencies]
experiments = ["lightgbm>=4.7.0,<5"]

[dependency-groups]
dev = [
    "lightgbm>=4.7.0,<5",
    "pytest>=8.0",
    "ruff>=0.12",
]
data = [
    "scs-hub",
]

[tool.uv.sources]
scs-hub = { git = "https://github.com/shaggycamel/scs.scs_hub.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/player_archetypes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
